[project]
name = "rlprof"
version = "0.1.0"
description = "CUPTI profiling of an RL fine-tuning loop (vLLM rollouts + FSDP2 training) and the rollout-training mismatch"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rlprof"]
